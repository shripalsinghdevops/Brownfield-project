trigger:
  branches:
    include:
      - main

pool:
  name: agent-pool

variables:
  terraformVersion: '1.13.3'
  workingDirectory: '$(Build.SourcesDirectory)/environment/prod'

steps:

# Install Terraform
- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '$(terraformVersion)'

# Terraform Init
- task: TerraformTask@5
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(workingDirectory)'
    backendServiceArm: 'shri-scn'
    backendAzureRmResourceGroupName: 'shri'
    backendAzureRmStorageAccountName: 'abcd123454321'
    backendAzureRmContainerName: 'container'
    backendAzureRmKey: 'brownfield-prod.tfstate'

# Terraform Validate
- task: TerraformTask@5
  displayName: 'Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(workingDirectory)'

# Terraform Plan
- task: TerraformTask@5
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(workingDirectory)'
    environmentServiceNameAzureRM: 'shri-scn'
    commandOptions: '-var-file="terraform.tfvars"'

# Terraform Apply
- task: TerraformTask@5
  displayName: 'Terraform Apply'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(workingDirectory)'
    environmentServiceNameAzureRM: 'shri-scn'
    commandOptions: '-auto-approve -var-file="terraform.tfvars"'